<!-- Sidebar Navigation Component -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Navigation</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="sidebar-nav.css">
</head>
<aside class="sidebar-nav" id="sidebar">
    <nav class="sidebar-menu">
        <a href="main-page.html" id="nav-dashboard">
            <span class="text-span">Dashboard</span>
        </a>
        <a href="cashier-orders.html" id="nav-orders">
            <span class="text-span">Order History</span>
        </a>
        <a href="customer-tables.html" id="nav-tables">
            <span class="text-span">Customer Tables</span>
        </a>
        <a href="report.html" id="nav-reports">
            <span class="text-span">Reports</span>
        </a>
        <a href="settings.html" id="nav-settings">
            <span class="text-span">Settings</span>
    </nav>
</aside>



<script>
// Set active navigation item based on current page
function setActiveNavItem() {
    const currentPath = window.location.pathname.split('/').pop();
    const navItems = document.querySelectorAll('.sidebar-menu a');

    navItems.forEach(item => {
        item.classList.remove('active');
        const href = item.getAttribute('href');
        if (href === currentPath) {
            item.classList.add('active');
        }
    });
}

// Hamburger Menu Functionality
function initializeHamburgerMenu() {
    const hamburgerMenu = document.getElementById('hamburgerMenu');
    const sidebar = document.getElementById('sidebar');

    if (hamburgerMenu && sidebar) {
        // Hamburger menu toggle
        hamburgerMenu.addEventListener('click', function() {
            hamburgerMenu.classList.toggle('active');
            sidebar.classList.toggle('open');
        });

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 768 &&
                !sidebar.contains(e.target) &&
                !hamburgerMenu.contains(e.target)) {
                sidebar.classList.remove('open');
                hamburgerMenu.classList.remove('active');
            }
        });
    }
}

// Initialize when DOM is loaded
document.addEventListener('DOMContentLoaded', function() {
    setActiveNavItem();
    initializeHamburgerMenu();
});
</script>
