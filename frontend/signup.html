<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
    <link rel="stylesheet" href="login-signup.css">
</head>


<body class="signup-page">

<div class="container">
    <div class="login-box">
        <h2>Create Account</h2>
        <p>Fill details to register</p>

        <form id="signupForm">

            <div class="role-select">
                <label><input type="radio" name="role" value="admin"> Admin</label>
                <label><input type="radio" name="role" value="operator"> Operator</label>
                <label><input type="radio" name="role" value="cashier"> Cashier</label>
                <label><input type="radio" name="role" value="customer"> Customer</label>
            </div>
            
            <div class="input-box">
                <input type="text" id="newUser" placeholder="User Name">
            </div>

            <div class="input-box">
                <input type="tel" id="newPhone" placeholder="Phone Number">
            </div>

            <div id="otpSection" style="display:none;">
                <div class="input-box">
                    <input type="text" id="newOtp" placeholder="Enter OTP">
                </div>
            </div>

            <button type="button" id="sendOtpBtn" class="btn">Send OTP</button>
            <button type="submit" id="signupBtn" class="btn" style="display:none;">Signup</button>

            <p class="signup">
                Already have an account? <a href="login.html">Login</a>
            </p>

            <p id="signupMsg"></p>
        </form>
    </div>
</div>

<script src="script-login-signup.js"></script>
</body>
</html>
