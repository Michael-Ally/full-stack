<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <!-- Header Navigation -->
    <div id="header-nav-placeholder"></div>
    <div id="sidebar-nav-placeholder"></div>


   

    <div class="container">

        <!-- Main Content -->
        <main class="main-content">
            <div class="left-panel">
                <div class="cart-full">
                    <div class="section-title">
                        <span>Your Cart</span>
                        <div class="title-line"></div>
                    </div>
                    <div class="cart-items">
                    </div>
                    <div class="cart-actions" style="margin-top: 20px; display: flex; gap: 15px;">
                        <button onclick="window.location.href='main-page.html'" class="btn" style="padding: 12px 24px; background: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer;">Continue Shopping</button>
                        <button onclick="proceedToCheckout()" class="btn complete" style="padding: 12px 24px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">Proceed to Checkout</button>
                    </div>
                </div>
            </div>
        </main>
    </main>

    <script>
        // Load navigation components
        fetch('header-nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-nav-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading header navigation:', error));

        fetch('sidebar-nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('sidebar-nav-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading sidebar navigation:', error));
    </script>
<script src="script-cart.js"></script>
</body>
</html>
